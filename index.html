<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応募 | 神羅テクノロジー</title>
<style>
:root{
  --bg:#f5f5f2;
  --white:#ffffff;
  --ink:#171918;
  --muted:#737871;
  --line:rgba(23,25,24,.11);
  --green:#718d76;
  --pale:#dfe8df;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.8;
}
a{text-decoration:none;color:inherit}
.container{width:min(1080px,calc(100% - 36px));margin:auto}

/* header */
header{
  padding:26px 0;
  border-bottom:1px solid var(--line);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:12px;font-weight:800}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  background:var(--ink);color:white;display:grid;place-items:center;
  font-weight:900;
}
.logo-name{font-size:14px;line-height:1.15}
.logo-name small{
  display:block;margin-top:3px;color:var(--muted);
  font-size:8px;letter-spacing:.16em;
}
.back{
  color:var(--muted);font-size:11px;font-weight:700;
  transition:.2s;
}
.back:hover{color:var(--ink)}

/* hero */
.hero{padding:95px 0 70px;text-align:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--green);font-size:10px;font-weight:800;
  letter-spacing:.18em;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{
  margin-top:22px;font-size:clamp(54px,8vw,96px);
  line-height:.95;letter-spacing:-.075em;font-weight:800;
}
h1 span{color:var(--green)}
.hero p{
  max-width:570px;margin:28px auto 0;
  color:var(--muted);font-size:14px;
}
.hero-button{
  display:inline-flex;align-items:center;justify-content:center;
  margin-top:38px;padding:0 28px;height:54px;
  border-radius:15px;background:var(--ink);color:white;
  font-size:11px;font-weight:800;letter-spacing:.12em;
  transition:.25s;
}
.hero-button:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.14)}

/* application */
.apply{
  padding:20px 0 110px;
  background:
    radial-gradient(circle at 10% 15%,var(--pale),transparent 25%),
    transparent;
}
.apply-card{
  max-width:720px;margin:auto;background:var(--white);
  border:1px solid var(--line);border-radius:30px;
  padding:46px;box-shadow:0 25px 80px rgba(0,0,0,.055);
}
.apply-head{
  display:flex;justify-content:space-between;align-items:end;
  padding-bottom:25px;border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.apply-head h2{font-size:28px;letter-spacing:-.04em}
.apply-head p{font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:800}
.field{margin-bottom:27px}
label{
  display:block;margin-bottom:8px;color:#777e77;
  font-size:9px;letter-spacing:.15em;font-weight:800;
}
input,textarea{
  width:100%;border:1px solid var(--line);border-radius:13px;
  background:#f8f9f6;color:var(--ink);outline:none;
  padding:14px 15px;font-size:14px;
  transition:.2s;
}
input:focus,textarea:focus{
  background:white;border-color:var(--green);
  box-shadow:0 0 0 4px rgba(113,141,118,.09);
}
textarea{min-height:155px;resize:vertical}
.required{color:var(--green);margin-left:4px}
.submit{margin-top:35px}
button{
  width:100%;height:57px;border:0;border-radius:14px;
  background:var(--ink);color:white;cursor:pointer;
  font-size:11px;font-weight:800;letter-spacing:.13em;
  transition:.25s;
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.15)}
button:disabled{opacity:.55;cursor:wait;transform:none}
.note{
  margin-top:18px;text-align:center;color:#929790;
  font-size:9px;
}

/* contact */
.contact{
  padding:0 0 100px;
}
.contact-box{
  max-width:720px;margin:auto;border-radius:28px;
  background:var(--ink);color:white;padding:35px 40px;
  display:flex;align-items:center;justify-content:space-between;gap:25px;
}
.contact-label{font-size:9px;letter-spacing:.17em;color:#89938b;font-weight:800}
.contact-mail{margin-top:5px;font-size:13px}
.contact-link{
  white-space:nowrap;border:1px solid rgba(255,255,255,.15);
  border-radius:12px;padding:11px 15px;color:#dce6dd;font-size:10px;
}

/* footer */
footer{
  padding:28px 0;border-top:1px solid var(--line);
  color:#8a9089;font-size:8px;letter-spacing:.08em;
}
.footer-inner{display:flex;justify-content:space-between}

/* success */
.success{
  position:fixed;inset:0;background:rgba(15,18,15,.65);
  backdrop-filter:blur(14px);display:grid;place-items:center;
  opacity:0;visibility:hidden;transition:.3s;z-index:10;
}
.success.active{opacity:1;visibility:visible}
.success-box{
  width:min(450px,calc(100% - 30px));background:white;
  border-radius:27px;padding:48px 35px;text-align:center;
  box-shadow:0 30px 100px rgba(0,0,0,.2);
}
.check{
  width:50px;height:50px;margin:auto;border-radius:15px;
  background:var(--ink);color:#c8d8ca;display:grid;place-items:center;
}
.success-box h2{margin-top:20px;font-size:24px}
.success-box p{margin-top:10px;color:var(--muted);font-size:12px}
.close{width:auto;padding:0 25px;margin-top:24px;height:45px}

/* mobile */
@media(max-width:600px){
  .container{width:calc(100% - 28px)}
  .hero{padding:70px 0 55px}
  .apply{padding-bottom:75px}
  .apply-card{padding:25px 20px;border-radius:23px}
  .apply-head{align-items:start;flex-direction:column;gap:5px}
  .contact-box{padding:28px 24px;flex-direction:column;align-items:flex-start}
  .contact-link{white-space:normal}
  .footer-inner{flex-direction:column;gap:5px}
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a class="logo" href="#">
      <span class="logo-mark">S</span>
      <span class="logo-name">神羅テクノロジー<small>SINNRA TECHNOLOGY</small></span>
    </a>
    <a class="back" href="javascript:history.back()">← 戻る</a>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <div class="eyebrow"><span class="dot"></span>APPLICATION</div>
    <h1>応募<span>する。</span></h1>
    <p>
      神羅テクノロジーへの参加をご希望の方は、<br>
      以下のフォームから必要事項をお送りください。
    </p>
    <a class="hero-button" href="#application">応募フォームへ　↓</a>
  </div>
</section>

<section class="apply" id="application">
  <div class="container">
    <form class="apply-card" id="form">

      <div class="apply-head">
        <h2>応募フォーム</h2>
        <p>SINNRA TECHNOLOGY</p>
      </div>

      <div class="field">
        <label for="name">お名前 <span class="required">*</span></label>
        <input id="name" type="text" placeholder="お名前を入力してください" required>
      </div>

      <div class="field">
        <label for="position">希望ポジション</label>
        <input id="position" type="text" placeholder="例：Linux Engineering">
      </div>

      <div class="field">
        <label for="github">GitHub / SNS</label>
        <input id="github" type="text" placeholder="https://github.com/...">
      </div>

      <div class="field">
        <label for="message">メッセージ <span class="required">*</span></label>
        <textarea id="message" placeholder="やりたいこと、興味のある技術などをご記入ください。" required></textarea>
      </div>

      <div class="submit">
        <button id="submit" type="submit">応募を送信する　→</button>
      </div>

      <div class="note">
        入力内容をご確認のうえ、送信してください。
      </div>

    </form>
  </div>
</section>

<section class="contact">
  <div class="container">
    <div class="contact-box">
      <div>
        <div class="contact-label">CONTACT</div>
        <div class="contact-mail">sinnra.technology@outlook.jp</div>
      </div>
      <a class="contact-link" href="mailto:sinnra.technology@outlook.jp">お問い合わせはこちら →</a>
    </div>
  </div>
</section>

</main>

<footer>
  <div class="container footer-inner">
    <span>© SINNRA TECHNOLOGY</span>
    <span>APPLICATION</span>
  </div>
</footer>

<div class="success" id="success">
  <div class="success-box">
    <div class="check">✓</div>
    <h2>応募を受け付けました。</h2>
    <p>ありがとうございます。<br>内容を確認のうえ、ご連絡いたします。</p>
    <button class="close" onclick="closeSuccess()">閉じる</button>
  </div>
</div>

<script>
const form=document.getElementById("form");
const button=document.getElementById("submit");

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  const webhookUrl="YOUR_DISCORD_WEBHOOK_URL";

  const name=document.getElementById("name").value.trim();
  const position=document.getElementById("position").value.trim();
  const github=document.getElementById("github").value.trim();
  const message=document.getElementById("message").value.trim();

  const payload={
    username:"神羅テクノロジー 採用Bot",
    embeds:[{
      title:"新しい応募が届きました",
      color:7381365,
      fields:[
        {name:"お名前",value:name||"未入力"},
        {name:"希望ポジション",value:position||"未入力"},
        {name:"GitHub / SNS",value:github||"未入力"},
        {name:"メッセージ",value:message||"未入力"}
      ],
      footer:{text:"SINNRA TECHNOLOGY / APPLICATION"},
      timestamp:new Date().toISOString()
    }]
  };

  button.disabled=true;
  button.textContent="送信しています…";

  try{
    const response=await fetch(webhookUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    if(!response.ok) throw new Error("Webhook error");

    form.reset();
    document.getElementById("success").classList.add("active");

  }catch(error){
    console.error(error);
    alert("送信できませんでした。設定を確認してください。");
  }finally{
    button.disabled=false;
    button.textContent="応募を送信する　→";
  }
});

function closeSuccess(){
  document.getElementById("success").classList.remove("active");
}
</script>

</body>
</html>
